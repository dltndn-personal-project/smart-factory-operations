          type: command
          run: |
            chk() { found=$(grep -rlE "^[[:space:]]*(import|from)[[:space:]]+$1([[:space:].]|$)" src | sort | tr '\n' ' '); [ "$found" = "$2 " ] || { echo "$1: $found"; exit 1; }; }

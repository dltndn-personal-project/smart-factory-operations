# 작업 계획. 사람이 PR로 리뷰한다. Agent가 추가하는 milestone과 task에는 proposed: true를 붙이고,
# 사람이 승인할 때 지운다. 작성법은 agent/core/examples/PLAN.yaml과 agent/core/process/20-plan.md.
# 2026-09-27 책임자가 채팅으로 이 계획(docs/plan/)을 승인했다(docs/spec/DECISIONS.md D-02, 조율 C-01). 그래서 M1~M6과 task에 proposed가 없다.
# task 블록의 원본 설명과 단계 개요는 docs/plan/ 계획 파일에 있고, 두 곳은 같아야 한다(docs/plan/README.md 1절).
milestones:
  - id: M0
    outcome: 도메인 슬롯을 채워 계획 기반 작업을 시작할 수 있다
    exit_criteria:
      - docs/COMPONENT.md에 미정 표시가 없다
      - agent/config.yaml에 실제로 실행해 본 검증 명령이 있다
      - 사람이 첫 도메인 milestone을 승인했다
  - id: M1
    outcome: 설정·시계·로그, 입력 Payload 파서 6종과 발행 Payload 생성, LineTracker·시간 결합, Interlock·Alarm·워커 처리 함수가 MQTT·DB 없이 가짜 시계·발행기·DB 싱크로 동작한다
    exit_criteria:
      - make test가 통과하고 C-01(test_payloads.py), C-02(test_interlock.py S-01~S-12, test_alarm.py L-01~L-11) 테스트가 그 안에 있다
      - 저장소 루트에서 .venv/bin/python -m factory_operations serve가 Broker·DB 없이 기동해 /healthz가 200이다
      - agent/config.yaml verify에 unit이 있다
  - id: M2
    outcome: db/schema.sql이 TimescaleDB initdb로 적용되고, DB 스레드가 쓰기 작업·센서 배치·요약 조회·재연결을 하며, 상관분석이 DB 데이터로 주기 계산된다
    exit_criteria:
      - make docker-test가 통과하고 C-03(test_schema.py) 테스트가 그 안에 있다
      - make test에 C-07(test_correlation.py 알려진 lag 13초) 테스트가 있다
      - agent/config.yaml verify에 docker가 있다
  - id: M3
    outcome: 실제 Mosquitto·TimescaleDB에 연결한 앱이 입력을 기록·결합하고, CRITICAL에 1초 안에 STOP과 Alarm Event를 내며, 명령 결과를 기록하고, /api/snapshot이 5초 안에 갱신된다
    exit_criteria:
      - make docker-test가 통과하고 C-04·C-06(test_app_flow.py), C-05(test_interlock_latency.py), C-08(test_dashboard_latency.py), broker 재시작 복구(test_broker_restart.py) 테스트가 그 안에 있다
      - Broker·DB 없이 기동한 앱의 /readyz가 503이고, paho·psycopg·FastAPI를 import하는 모듈이 각각 하나다
  - id: M4
    outcome: 브라우저 Dashboard가 스냅숏으로 모든 칸을 그리고, 이미지 smoke가 컨테이너 안의 앱을 자동 확인하며, 개발용 compose와 가짜 입력으로 다른 Component 없이 화면 전체를 볼 수 있다
    exit_criteria:
      - make smoke가 통과한다 (C-09)
      - 개발용 compose와 fake_feed로 띄운 앱의 스냅숏에 라인·PdM·스펙트럼·진동·검사가 LIVE로 나오고 STOP이 적용된다 (OPS-9B A4)
      - docs/COMPONENT.md 실행 절이 실제 실행 방법과 같다
      - agent/config.yaml verify에 smoke가 있다
  - id: M5
    outcome: PdM Result·PdM Spectrum·Alarm Event가 확정된 Shared commit을 contract_ref로 채택하고, 파서·fixture·spec이 그 확정본과 맞다
    exit_criteria:
      - SHARED_CONFIG.json contract_ref가 그 Shared commit이고 validate.py --remote가 통과한다
      - contract_ref의 INTERFACES 예시로 만든 fixture를 파서가 받고, build_alarm의 키가 Shared Alarm Event 예시와 같다
  - id: M6
    outcome: 사람이 맥북 브라우저에서 Dashboard 확인 목록을 통과시켰다
    exit_criteria:
      - HUM-1의 M-01~M-10이 모두 통과다 (C-10)
tasks:
  - id: BOOT-1
    milestone: M0
    type: bootstrap
    title: 도메인 슬롯 채우기
    why: 절차는 도메인을 모르므로 COMPONENT.md와 검증 명령이 있어야 task를 계획하고 검증할 수 있다
    depends_on: []
    scope: [docs/COMPONENT.md, agent/config.yaml, agent/PLAN.yaml]
    acceptance:
      - id: A1
        text: COMPONENT.md에 미정 표시가 남아 있지 않다
        check: {type: command, run: "! grep -q '<미정' docs/COMPONENT.md"}
      - id: A2
        text: 공통 검증 명령이 하나 이상 있다 (verify 단계에서 모두 실행된다)
        check: {type: command, run: "python3 -c \"import sys, yaml; sys.exit(not yaml.safe_load(open('agent/config.yaml'))['verify'])\""}
      - id: A3
        text: 사람이 첫 도메인 milestone과 task 분해를 승인했다
        check: {type: manual, how: "PLAN.yaml에 proposed로 추가한 milestone과 task의 proposed 표시를 사람이 제거한다"}
    size: M
  - id: OPS-1
    milestone: M1
    type: feature
    title: 패키지 골격, 설정, 시계, 로그, /healthz, Makefile
    why: 모든 task가 쓰는 패키지 구조·설정 로딩·시계 주입·JSON 로그·공용 fixture·검증 진입점을 먼저 만든다 (spec 01, 07 1·2·6·7절, 08 2·3.1·5절)
    depends_on: [BOOT-1]
    scope: [src/**, config/**, tests/**, pyproject.toml, requirements.txt, requirements-dev.txt, Makefile, .gitignore, .env.example, agent/config.yaml, docs/spec/01-core.md, docs/spec/07-runtime.md, docs/spec/DECISIONS.md]
    acceptance:
      - id: A1
        text: 단위 테스트 전체가 통과한다
        check: {type: command, run: "make test"}
      - id: A2
        text: 설정이 기본값 로드, overlay 깊은 병합, 환경 변수 우선, 모르는 키와 범위 밖 값(interlock.pending_timeout_s 0, correlation.default_lag_s 40)의 키 경로 오류·종료 코드 2를 만족한다 (01 4절, 08 3.1절)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/unit/test_config.py tests/unit/test_config.py::test_overlay_deep_merge tests/unit/test_config.py::test_env_overrides_file tests/unit/test_config.py::test_unknown_key_exits_2 tests/unit/test_config.py::test_out_of_range_exits_2"}
      - id: A3
        text: iso_ms가 밀리초 3자리·버림(…59.9999가 다음 초로 올라가지 않음)·Z로 CONVENTIONS 정규식에 맞고, parse_ts가 정규식 밖 입력(…13Z, …13.4Z, +00:00)을 거부한다 (01 5절)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/unit/test_clock.py tests/unit/test_clock.py::test_iso_ms_truncates tests/unit/test_clock.py::test_parse_ts_rejects_non_ms"}
      - id: A4
        text: 같은 (event, topic, reason) 11번이 10초 안에 오면 한 줄이고, 10초 뒤 다음 줄에 suppressed 10이 붙는다 (01 6절)
        check: {type: command, run: "make venv >/dev/null && .venv/bin/python -m pytest -q tests/unit/test_log.py tests/unit/test_log.py::test_suppression_window"}
      - id: A5
        text: 저장소 루트에서 serve가 Broker·DB 없이 기동해 /healthz에 200, status ok, commit(GIT_COMMIT 값)으로 답한다 (01 7절, 06 2절)
        check:
          type: command
          run: |
            make venv >/dev/null || exit 1
            d=$(mktemp -d)
            HTTP_PORT=18280 GIT_COMMIT=ops1check MQTT_URL=mqtt://127.0.0.1:1 DATABASE_URL=postgresql://x:x@127.0.0.1:1/x .venv/bin/python -m factory_operations serve >"$d/serve.log" 2>&1 &
            pid=$!
            ok=1
            for i in $(seq 60); do
              if curl -fsS --max-time 1 http://127.0.0.1:18280/healthz >"$d/h.json" 2>/dev/null && grep -Eq '"status" *: *"ok"' "$d/h.json" && grep -Eq '"commit" *: *"ops1check"' "$d/h.json"; then ok=0; break; fi
              sleep 0.25
            done
            kill "$pid"; wait "$pid"
            [ "$ok" -eq 0 ] || cat "$d/serve.log"
            exit "$ok"
      - id: A6
        text: 모르는 설정 키(FOPS_CONFIG overlay의 http.bogus_key)가 있으면 serve가 기동하지 않고 종료 코드 2로 끝나며 오류에 키 경로가 나온다 (01 4절)
        check:
          type: command
          run: |
            make venv >/dev/null || exit 1
            f=$(mktemp)
            printf 'http:\n  bogus_key: 1\n' > "$f"
            FOPS_CONFIG="$f" .venv/bin/python -c "import subprocess, sys; r = subprocess.run([sys.executable, '-m', 'factory_operations', 'serve'], capture_output=True, text=True, timeout=20); out = r.stdout + r.stderr; print(r.returncode, out[-500:]); sys.exit(0 if r.returncode == 2 and 'http.bogus_key' in out else 1)"
      - id: A7
        text: config/default.yaml의 키 집합이 spec 설정 표(02 1절, 03 5절, 04 3절, 05 6절, 06 6절, 07 1절)의 키 집합과 같고 모든 기본값이 표와 같다 (01 4절, D-38)
        check:
          type: command
          run: |
            python3 - <<'EOF'
            import re, sys, yaml
            sections = {"http", "mqtt", "db", "paths", "logging", "line", "interlock", "join", "correlation", "pdm", "dashboard"}
            want = {}
            for f in ("02-mqtt", "03-control", "04-analysis", "05-storage", "06-dashboard", "07-runtime"):
                for line in open("docs/spec/%s.md" % f):
                    m = re.match(r"^\| `([a-z_]+)\.([a-z_]+)` \| ([^|]*) \|", line)
                    if m and m.group(1) in sections:
                        cell = m.group(3).strip()
                        v = re.match(r"`([^`]*)`", cell)
                        want[(m.group(1), m.group(2))] = v.group(1) if v else cell.split(" ")[0]
            c = yaml.safe_load(open("config/default.yaml"))
            have = {(s, k): v for s, d in c.items() for k, v in (d or {}).items()}
            def same(raw, v):
                if raw == "null":
                    return v is None
                if isinstance(v, (int, float)) and not isinstance(v, bool):
                    return float(raw) == float(v)
                return str(v) == raw
            bad = sorted(set(want) ^ set(have)) + sorted(k for k in want if k in have and not same(want[k], have[k]))
            print(len(want), "keys in spec tables; mismatch:", bad)
            sys.exit(1 if bad or len(want) < 36 else 0)
            EOF

    why: MQTT 수신 → 워커 → 발행·DB·StateStore → HTTP가 한 프로세스로 이어져야 실제 broker·DB에서 기록·결합·Interlock·명령 결과가 동작한다 (C-04, C-06, spec 01 2·7절, 02 1·4·5절, 03 3.3절)

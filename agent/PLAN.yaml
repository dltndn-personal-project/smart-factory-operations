            python3 - "$f" <<'EOF' || exit 1
            import json, re, sys
            blocks = []
            fence = "`" * 3
            for body in re.findall(fence + r"json\n(.*?)" + fence, open(sys.argv[1]).read(), re.S):
                try:
                    blocks.append(json.loads(body))

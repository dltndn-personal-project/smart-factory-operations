# 작업 계획. 사람이 PR로 리뷰한다. Agent가 추가하는 milestone과 task에는 proposed: true를 붙이고,
# 사람이 승인할 때 지운다. 작성법은 agent/core/examples/PLAN.yaml과 agent/core/process/20-plan.md.
milestones:
  - id: M0
    outcome: 도메인 슬롯을 채워 계획 기반 작업을 시작할 수 있다
    exit_criteria:
      - docs/COMPONENT.md에 미정 표시가 없다
      - agent/config.yaml에 실제로 실행해 본 검증 명령이 있다
      - 사람이 첫 도메인 milestone을 승인했다
tasks:
  - id: BOOT-1
    milestone: M0
    type: bootstrap
    title: 도메인 슬롯 채우기
    why: 절차는 도메인을 모르므로 COMPONENT.md와 검증 명령이 있어야 task를 계획하고 검증할 수 있다
    depends_on: []
    scope: [docs/COMPONENT.md, agent/config.yaml, agent/PLAN.yaml]
    acceptance:
      - id: A1
        text: COMPONENT.md에 미정 표시가 남아 있지 않다
        check: {type: command, run: "! grep -q '<미정' docs/COMPONENT.md"}
      - id: A2
        text: 공통 검증 명령이 하나 이상 있다 (verify 단계에서 모두 실행된다)
        check: {type: command, run: "python3 -c \"import sys, yaml; sys.exit(not yaml.safe_load(open('agent/config.yaml'))['verify'])\""}
      - id: A3
        text: 사람이 첫 도메인 milestone과 task 분해를 승인했다
        check: {type: manual, how: "PLAN.yaml에 proposed로 추가한 milestone과 task의 proposed 표시를 사람이 제거한다"}
    size: M
